<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>recipe-server</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      ul { list-style: none; padding: 0; }
      li { padding: .5rem 0; border-bottom: 1px solid #ddd; display: flex; align-items: center; }
      .category { background: #eef; border-radius: 4px; padding: 0 .35rem; margin-right: .4rem; font-size: .85em; }
      li .star { margin-left: auto; cursor: pointer; font-size: 1.15em; padding: 0 .25rem; }
      .star-on { color: #eab308; }
      .star-off { color: lightgrey; }
      #saved h2 { font-size: 1rem; margin: 1.5rem 0 .25rem; }
    form#filters { display: flex; gap: .5rem; justify-content: space-between; }
      form#filters input, form#filters select { flex: 1; min-width: 0; }
      form#filters select { max-width: 11rem; }
    </style>
  </head>
  <body>
    <h1>The Rotation</h1>

    <form id="filters">
      <input
        type="search"
        name="name"
        placeholder="Filter by name"
        value="{{nameValue}}"
        hx-get="/recipes"
        hx-trigger="input changed delay:200ms"
        hx-include="closest form"
        hx-target="#recipes"
        hx-swap="innerHTML"
        hx-push-url="true"
      />
      <select
        name="category"
        hx-get="/recipes"
        hx-trigger="change"
        hx-include="closest form"
        hx-target="#recipes"
        hx-swap="innerHTML"
        hx-push-url="true"
      >
        <option value="">All categories</option>
        {{categoryOptions}}
      </select>
    </form>

    <div id="recipes">{{recipes}}</div>

    <p>
      <a href="/recipes/new"><strong>+ Add recipe</strong></a>
    </p>
  </body>
</html>
